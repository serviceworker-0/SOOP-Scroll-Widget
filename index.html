<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    --left-shift: -4%;
    --right-shift: 4%;
    --hint-opacity: 0.96;

    position: relative;
    width: min(94vw, 860px);
    max-height: 90vh;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 10px solid #d29a52;
    border-radius: 12px;
    outline: none;
    background: #f8eccf;
    box-shadow:
      0 22px 50px rgb(104 67 24 / 22%),
      inset 0 0 0 2px #f3c778;
    cursor: ew-resize;
    touch-action: none;
  }

  .content {
    position: absolute;
    inset: 0;
    background: #f8eccf;
  }

  .content img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .door {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 3;
    width: 50%;
    overflow: hidden;
    background:
      linear-gradient(
        90deg,
        #dfad60,
        #efca87 48%,
        #dba657
      );
    box-shadow:
      inset 0 0 16px rgb(116 72 21 / 14%);
    transition:
      transform 0.5s
      cubic-bezier(.2, .8, .2, 1);
    will-change: transform;
  }

  .door::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 7px solid #c98d41;
    background-color: #fff3cf;
    background-image:
      linear-gradient(
        90deg,
        transparent calc(100% - 4px),
        #ddb36d calc(100% - 4px)
      ),
      linear-gradient(
        0deg,
        transparent calc(100% - 4px),
        #ddb36d calc(100% - 4px)
      );
    background-size:
      33.333% 100%,
      100% 33.333%;
    box-shadow:
      inset 0 0 14px rgb(148 96 31 / 10%);
  }

  .door.left {
    left: 0;
    border-right: 5px solid #9f682c;
    transform:
      translateX(var(--left-shift));
  }

  .door.right {
    right: 0;
    border-left: 5px solid #9f682c;
    transform:
      translateX(var(--right-shift));
  }

  .handle {
    position: absolute;
    top: 50%;
    z-index: 5;
    width: 13px;
    height: 46px;
    transform: translateY(-50%);
    border: 2px solid #4b2d13;
    border-radius: 999px;
    pointer-events: none;
    background:
      linear-gradient(
        90deg,
        #543317,
        #8a5c2a 48%,
        #543317
      );
    box-shadow:
      inset 2px 0 3px rgb(255 234 183 / 24%),
      0 2px 5px rgb(74 44 17 / 28%);
  }

  .door.left .handle {
    right: 18px;
  }

  .door.right .handle {
    left: 18px;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 14px;
    z-index: 8;
    transform: translateX(-50%);
    padding: 7px 11px;
    border-radius: 999px;
    color: #fff8e8;
    background: rgb(72 45 19 / 64%);
    font:
      600 12px / 1
      system-ui,
      sans-serif;
    white-space: nowrap;
    pointer-events: none;
    opacity: var(--hint-opacity);
    transition: opacity 0.45s ease;
  }

  .scene.dragging .door,
  .scene.dragging .hint {
    transition: none;
  }

  .scene:focus-visible {
    box-shadow:
      0 0 0 4px rgb(226 172 93 / 62%),
      0 22px 50px rgb(104 67 24 / 22%);
  }

  @media (prefers-reduced-motion: reduce) {
    .door,
    .hint {
      transition: none !important;
    }
  }
</style>
