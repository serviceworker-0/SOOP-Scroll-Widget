<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d7b98b">
  <title>Sliding Door Widget</title>

  <style>
    :root {
      color-scheme: light;
      --oak-light: #e7cfaa;
      --oak-mid: #cfaa74;
      --oak-dark: #967047;
      --paper: #f7f1df;
      --bronze: #463727;
      --ease-door: cubic-bezier(.22, .74, .16, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      --open: .065;
      --left-shift: -6.5%;
      --right-shift: 6.5%;
      position: relative;
      width: min(96vw, 960px);
      max-height: 92vh;
      aspect-ratio: 16 / 9;
      isolation: isolate;
      overflow: hidden;
      border: clamp(8px, 1.25vw, 13px) solid transparent;
      border-radius: clamp(4px, .65vw, 7px);
      outline: none;
      background:
        linear-gradient(#c7a06e, #ddb989) padding-box,
        linear-gradient(105deg, #efd9b8, #b88b57 42%, #e5c59a 72%, #9c7349) border-box;
      box-shadow:
        0 18px 38px rgb(54 35 17 / 18%),
        0 3px 8px rgb(54 35 17 / 14%),
        inset 0 0 0 1px rgb(255 244 220 / 54%);
      cursor: ew-resize;
      touch-action: none;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      right: 0;
      left: 0;
      z-index: 10;
      height: clamp(7px, 1vw, 11px);
      pointer-events: none;
      background:
        linear-gradient(90deg, rgb(255 255 255 / 11%), transparent 24%, rgb(91 57 28 / 9%) 67%, transparent),
        linear-gradient(#e1c091, #c69b67 55%, #a8794b);
    }

    .scene::before {
      top: 0;
      border-bottom: 1px solid rgb(101 71 43 / 44%);
      box-shadow: 0 4px 8px rgb(43 28 15 / 17%);
    }

    .scene::after {
      bottom: 0;
      border-top: 1px solid rgb(255 239 211 / 50%);
      box-shadow: 0 -3px 7px rgb(43 28 15 / 13%);
    }

    .content {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #1a110d;
    }

    .content img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
      transform: scale(1.002);
    }

    .content::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgb(21 12 7 / 18%), transparent 9%, transparent 91%, rgb(21 12 7 / 18%)),
        linear-gradient(rgb(21 12 7 / 10%), transparent 10%, transparent 90%, rgb(21 12 7 / 12%));
      box-shadow: inset 0 0 22px rgb(21 12 7 / 24%);
    }

    .door {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 4;
      width: 50.15%;
      overflow: visible;
      background:
        repeating-linear-gradient(87deg, rgb(255 255 255 / 3%) 0 1px, transparent 1px 18px),
        linear-gradient(102deg, #e5c89e, #cda673 51%, #b98b57);
      transition: transform .54s var(--ease-door);
      will-change: transform;
    }

    .door.left {
      left: 0;
      transform: translateX(var(--left-shift));
      box-shadow:
        6px 0 12px rgb(36 22 11 / 21%),
        inset -1px 0 rgb(96 64 36 / 48%);
    }

    .door.right {
      right: 0;
      transform: translateX(var(--right-shift));
      box-shadow:
        -6px 0 12px rgb(36 22 11 / 21%),
        inset 1px 0 rgb(255 235 203 / 38%);
    }

    .panel {
      position: absolute;
      inset: clamp(13px, 1.8vw, 19px) clamp(11px, 1.55vw, 17px);
      overflow: hidden;
      border: clamp(5px, .72vw, 7px) solid #bd915d;
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(7deg, transparent 0 8px, rgb(130 103 67 / 2.8%) 9px, transparent 10px 19px),
        repeating-linear-gradient(93deg, transparent 0 14px, rgb(255 255 255 / 7%) 15px, transparent 16px 31px),
        radial-gradient(circle at 28% 18%, rgb(255 255 255 / 45%), transparent 42%),
        linear-gradient(112deg, #faf6e8, #f0e6cf);
      box-shadow:
        inset 0 0 18px rgb(116 79 40 / 10%),
        0 0 0 1px rgb(103 69 37 / 19%);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .88;
      background-image:
        linear-gradient(90deg,
          transparent calc(33.333% - 2px),
          #c9a16d calc(33.333% - 2px) calc(33.333% + 2px),
          transparent calc(33.333% + 2px) calc(66.666% - 2px),
          #c9a16d calc(66.666% - 2px) calc(66.666% + 2px),
          transparent calc(66.666% + 2px)),
        linear-gradient(0deg,
          transparent calc(20% - 2px),
          #c9a16d calc(20% - 2px) calc(20% + 2px),
          transparent calc(20% + 2px) calc(40% - 2px),
          #c9a16d calc(40% - 2px) calc(40% + 2px),
          transparent calc(40% + 2px) calc(60% - 2px),
          #c9a16d calc(60% - 2px) calc(60% + 2px),
          transparent calc(60% + 2px) calc(80% - 2px),
          #c9a16d calc(80% - 2px) calc(80% + 2px),
          transparent calc(80% + 2px));
      filter: drop-shadow(1px 1px 1px rgb(91 60 29 / 14%));
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(118deg, rgb(255 255 255 / 14%), transparent 32%, rgb(101 69 36 / 4%));
    }

    .center-stile {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      width: clamp(21px, 2.65vw, 28px);
      background:
        linear-gradient(90deg, rgb(255 255 255 / 13%), transparent 22%, rgb(84 51 24 / 10%) 78%),
        linear-gradient(#e2c296, #c79c68);
      box-shadow: inset 0 0 0 1px rgb(95 63 33 / 22%);
    }

    .door.left .center-stile {
      right: 0;
      border-right: 1px solid rgb(91 59 31 / 50%);
    }

    .door.right .center-stile {
      left: 0;
      border-left: 1px solid rgb(255 240 213 / 40%);
    }

    .handle {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: clamp(11px, 1.35vw, 15px);
      height: clamp(43px, 7vw, 62px);
      transform: translateY(-50%);
      border: 1px solid #6b5740;
      border-radius: 3px;
      pointer-events: none;
      background:
        linear-gradient(90deg, #554434, #2f281f 43%, #403429 75%, #65523d);
      box-shadow:
        inset 2px 0 3px rgb(255 239 203 / 12%),
        inset 0 0 0 2px rgb(19 15 11 / 31%),
        0 1px 2px rgb(52 33 17 / 28%);
    }

    .door.left .handle {
      right: clamp(5px, .7vw, 8px);
    }

    .door.right .handle {
      left: clamp(5px, .7vw, 8px);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 3.2vw, 28px);
      z-index: 15;
      transform: translate(-50%, 4px);
      padding: 8px 13px 9px;
      border: 1px solid rgb(255 240 213 / 14%);
      border-radius: 999px;
      color: #f9f4e9;
      background: rgb(32 25 19 / 69%);
      box-shadow: 0 5px 16px rgb(19 12 8 / 18%);
      backdrop-filter: blur(5px);
      font: 650 clamp(12px, 1.7vw, 15px) / 1.1 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      letter-spacing: -.015em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }

    .hint.visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .scene.dragging .door,
    .scene.dragging .hint {
      transition: none;
    }

    .scene:focus-visible {
      box-shadow:
        0 0 0 4px rgb(224 184 128 / 62%),
        0 18px 38px rgb(54 35 17 / 18%);
    }

    @media (max-width: 520px) {
      body {
        padding: 7px;
      }

      .scene {
        width: 98vw;
      }

      .panel {
        inset: 9px 8px;
        border-width: 4px;
      }

      .center-stile {
        width: 17px;
      }

      .handle {
        height: 37px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .door,
      .hint {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div
    id="scene"
    class="scene"
    role="slider"
    tabindex="0"
    aria-label="프로필 이미지를 여는 미닫이문"
    aria-valuemin="7"
    aria-valuemax="100"
    aria-valuenow="7"
    aria-valuetext="거의 닫힘"
  >
    <div class="content">
      <img src="./image.webp" alt="">
    </div>

    <div class="door left" aria-hidden="true">
      <div class="panel"></div>
      <div class="center-stile">
        <span class="handle"></span>
      </div>
    </div>

    <div class="door right" aria-hidden="true">
      <div class="panel"></div>
      <div class="center-stile">
        <span class="handle"></span>
      </div>
    </div>

    <div class="hint hint-closed">으… 꼬붕 발견</div>
    <div class="hint hint-open">아, 나가라고!</div>
  </div>

  <script>
    const root = document.querySelector("#scene");
    const closedHint = document.querySelector(".hint-closed");
    const openHint = document.querySelector(".hint-open");

    const initialOpen = 0.065;
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const hintDelay = reducedMotion ? 0 : 560;

    let open = initialOpen;
    let dragging = false;
    let moved = false;
    let suppressClick = false;
    let pointerId = null;
    let startX = 0;
    let startOpen = open;
    let lockedDirection = 0;
    let userInteracted = false;
    let hintTimer = 0;

    function clamp(value) {
      return Math.max(initialOpen, Math.min(1, value));
    }

    function hideHints() {
      clearTimeout(hintTimer);
      closedHint.classList.remove("visible");
      openHint.classList.remove("visible");
    }

    function showHint(type) {
      hideHints();
      if (type === "closed") closedHint.classList.add("visible");
      if (type === "open") openHint.classList.add("visible");
    }

    function updateHint(animate = false, immediate = false) {
      hideHints();
      if (dragging) return;

      let type = "";
      if (open <= initialOpen + .001) type = "closed";
      else if (open >= .999) type = "open";
      if (!type) return;

      if (immediate || !animate || hintDelay === 0) {
        showHint(type);
        return;
      }

      const expectedOpen = open;
      hintTimer = setTimeout(() => {
        if (!dragging && Math.abs(open - expectedOpen) <= .001) {
          showHint(type);
        }
      }, hintDelay);
    }

    function render(value, animate = false, immediateHint = false) {
      open = clamp(value);
      root.classList.toggle("dragging", !animate);
      root.style.setProperty("--open", open.toFixed(3));
      root.style.setProperty("--left-shift", `${(-open * 100).toFixed(3)}%`);
      root.style.setProperty("--right-shift", `${(open * 100).toFixed(3)}%`);

      const percentage = Math.round(open * 100);
      root.setAttribute("aria-valuenow", String(percentage));
      root.setAttribute(
        "aria-valuetext",
        percentage < 10 ? "거의 닫힘" : percentage > 90 ? "열림" : `${percentage}% 열림`
      );
      updateHint(animate, immediateHint);
    }

    root.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.isPrimary === false || dragging) return;

      event.preventDefault();
      userInteracted = true;
      dragging = true;
      moved = false;
      suppressClick = false;
      pointerId = event.pointerId;
      startX = event.clientX;
      startOpen = open;
      lockedDirection = 0;
      root.classList.add("dragging");
      hideHints();

      try {
        root.setPointerCapture(pointerId);
      } catch {}
    });

    root.addEventListener("pointermove", event => {
      if (!dragging || event.pointerId !== pointerId) return;

      const deltaX = event.clientX - startX;
      const distance = Math.abs(deltaX);
      if (lockedDirection === 0 && distance >= 8) {
        lockedDirection = deltaX > 0 ? 1 : -1;
        moved = true;
      }
      if (lockedDirection === 0) return;

      const rect = root.getBoundingClientRect();
      const directedDistance = Math.max(0, deltaX * lockedDirection);
      const change = directedDistance / (rect.width * .44);
      const next = startOpen >= .5 ? startOpen - change : startOpen + change;
      render(next, false);
    });

    function finishDrag(event) {
      if (!dragging || event.pointerId !== pointerId) return;

      dragging = false;
      suppressClick = moved;
      moved = false;
      try {
        root.releasePointerCapture(pointerId);
      } catch {}
      pointerId = null;
      lockedDirection = 0;
      render(open >= .48 ? 1 : initialOpen, true);
    }

    root.addEventListener("pointerup", finishDrag);
    root.addEventListener("pointercancel", finishDrag);
    root.addEventListener("lostpointercapture", event => {
      if (!dragging || event.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      lockedDirection = 0;
      render(open >= .48 ? 1 : initialOpen, true);
    });

    root.addEventListener("click", () => {
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      userInteracted = true;
      render(open >= .5 ? initialOpen : 1, true);
    });

    root.addEventListener("keydown", event => {
      let next = open;
      if (event.key === "ArrowRight" || event.key === "ArrowUp") {
        next += event.shiftKey ? .2 : .08;
      } else if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
        next -= event.shiftKey ? .2 : .08;
      } else if (event.key === "Home") {
        next = initialOpen;
      } else if (event.key === "End") {
        next = 1;
      } else if (event.key === "Enter" || event.key === " ") {
        next = open >= .5 ? initialOpen : 1;
      } else {
        return;
      }

      event.preventDefault();
      userInteracted = true;
      render(next, true);
    });

    if (!reducedMotion) {
      setTimeout(() => {
        if (userInteracted) return;
        render(.3, true);
        setTimeout(() => {
          if (!userInteracted) render(initialOpen, true);
        }, 980);
      }, 720);
    }

    render(open, true, true);
  </script>
</body>
</html>
