<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Japanese Sliding Door</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      --open: 0.04;

      position: relative;
      width: min(94vw, 860px);
      max-height: 90vh;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 12px solid #402713;
      border-radius: 8px;
      outline: none;
      background: #171b22;
      box-shadow:
        0 24px 55px rgb(23 13 7 / 38%),
        inset 0 0 0 2px #8a5b31;
      cursor: ew-resize;
      touch-action: none;
    }

    .interior {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          transparent 49.5%,
          rgb(255 220 155 / 12%) 50%,
          transparent 50.5%
        ),
        linear-gradient(
          to bottom,
          #18212b 0 57%,
          #5b4732 57% 60%,
          #b19a6a 60% 100%
        );
    }

    .interior::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 120px,
          rgb(65 48 29 / 34%) 120px 124px
        ),
        repeating-linear-gradient(
          7deg,
          rgb(255 255 255 / 3%) 0 2px,
          transparent 2px 8px
        );
    }

    .lamp-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 3px;
      height: 27%;
      transform: translateX(-50%);
      background: #1c1712;
    }

    .lamp {
      position: absolute;
      left: 50%;
      top: 25%;
      width: clamp(54px, 10vw, 92px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border: 7px solid #4d2c17;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          #fff8d6 0 28%,
          #f2bb64 55%,
          #b7652d 100%
        );
      box-shadow:
        0 0 45px rgb(255 190 92 / 48%);
    }

    .door {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 4;
      width: 50%;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          90deg,
          rgb(45 20 8 / 17%) 0 1px,
          transparent 1px 8px
        ),
        linear-gradient(
          90deg,
          #6d3d1e,
          #a66e3b 44%,
          #744321
        );
      box-shadow:
        inset 0 0 22px rgb(34 15 5 / 38%);
      transition:
        transform 0.52s
        cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }

    .door::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 8px solid #593117;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 calc(25% - 6px),
          #61391e calc(25% - 6px) 25%
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0 62px,
          #61391e 62px 69px
        ),
        linear-gradient(
          90deg,
          rgb(239 219 176 / 94%),
          rgb(205 174 122 / 92%)
        );
      box-shadow:
        inset 0 0 20px rgb(75 44 20 / 28%);
    }

    .door.left {
      left: 0;
      border-right: 7px solid #38200f;
      transform:
        translateX(calc(var(--open) * -100%));
    }

    .door.right {
      right: 0;
      border-left: 7px solid #38200f;
      transform:
        translateX(calc(var(--open) * 100%));
    }

    .handle {
      position: absolute;
      top: 50%;
      z-index: 6;
      width: 16px;
      height: 54px;
      transform: translateY(-50%);
      border: 2px solid #24150d;
      border-radius: 4px;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          #21140d,
          #775337 45%,
          #28180f
        );
      box-shadow:
        0 3px 7px rgb(20 10 5 / 45%);
    }

    .door.left .handle {
      right: 20px;
    }

    .door.right .handle {
      left: 20px;
    }

    .beam {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 7;
      height: 14px;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          90deg,
          rgb(255 255 255 / 5%) 0 2px,
          transparent 2px 10px
        ),
        linear-gradient(
          #704524,
          #341d0e
        );
      box-shadow:
        0 2px 5px rgb(20 10 4 / 40%);
    }

    .beam.top {
      top: 0;
    }

    .beam.bottom {
      bottom: 0;
      transform: rotate(180deg);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 25px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 2px solid #b7834c;
      border-radius: 5px;
      color: #f8ead1;
      background:
        repeating-linear-gradient(
          90deg,
          rgb(255 255 255 / 4%) 0 1px,
          transparent 1px 7px
        ),
        #402713;
      box-shadow:
        0 5px 13px rgb(20 10 5 / 38%);
      font:
        700 clamp(12px, 2.2vw, 15px) / 1
        system-ui,
        sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: calc(1 - var(--open));
      transition: opacity 0.4s ease;
    }

    .scene.dragging .door,
    .scene.dragging .hint {
      transition: none;
    }

    .scene:focus-visible {
      box-shadow:
        0 0 0 4px rgb(188 124 58 / 65%),
        0 24px 55px rgb(23 13 7 / 38%);
    }

    @media (prefers-reduced-motion: reduce) {
      .door,
      .hint {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div
    id="scene"
    class="scene"
    role="slider"
    tabindex="0"
    aria-label="미닫이문 열기"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="4"
  >
    <div class="interior">
      <div class="lamp-line"></div>
      <div class="lamp"></div>
    </div>

    <div class="door left">
      <span class="handle"></span>
    </div>

    <div class="door right">
      <span class="handle"></span>
    </div>

    <div class="beam top"></div>
    <div class="beam bottom"></div>

    <div class="hint">
      누구냐? 문 닫아라.
    </div>
  </div>

  <script>
    const root = document.querySelector("#scene");

    let open = 0.04;
    let dragging = false;
    let moved = false;
    let suppressClick = false;
    let pointerId = null;
    let startX = 0;
    let startOpen = open;
    let lockedDirection = 0;
    let userInteracted = false;

    function clamp(value) {
      return Math.max(0, Math.min(1, value));
    }

    function render(value, animate = false) {
      open = clamp(value);

      root.classList.toggle(
        "dragging",
        !animate
      );

      root.style.setProperty(
        "--open",
        open
      );

      root.setAttribute(
        "aria-valuenow",
        String(Math.round(open * 100))
      );
    }

    root.addEventListener(
      "pointerdown",
      event => {
        if (
          event.button !== 0 ||
          event.isPrimary === false ||
          dragging
        ) {
          return;
        }

        event.preventDefault();

        userInteracted = true;
        dragging = true;
        moved = false;
        suppressClick = false;
        pointerId = event.pointerId;
        startX = event.clientX;
        startOpen = open;
        lockedDirection = 0;

        root.classList.add("dragging");

        try {
          root.setPointerCapture(pointerId);
        } catch {}
      }
    );

    root.addEventListener(
      "pointermove",
      event => {
        if (
          !dragging ||
          event.pointerId !== pointerId
        ) {
          return;
        }

        const deltaX =
          event.clientX - startX;

        const distance =
          Math.abs(deltaX);

        if (distance > 4) {
          moved = true;
        }

        if (
          lockedDirection === 0 &&
          distance >= 8
        ) {
          lockedDirection =
            deltaX > 0 ? 1 : -1;
        }

        if (lockedDirection === 0) {
          return;
        }

        const rect =
          root.getBoundingClientRect();

        const directedDistance =
          Math.max(
            0,
            deltaX * lockedDirection
          );

        const change =
          directedDistance /
          (rect.width * 0.45);

        const next =
          startOpen >= 0.5
            ? startOpen - change
            : startOpen + change;

        render(next, false);
      }
    );

    function finishDrag(event) {
      if (
        !dragging ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      dragging = false;
      suppressClick = moved;
      moved = false;

      try {
        root.releasePointerCapture(pointerId);
      } catch {}

      pointerId = null;
      lockedDirection = 0;

      render(
        open >= 0.48 ? 1 : 0,
        true
      );
    }

    root.addEventListener(
      "pointerup",
      finishDrag
    );

    root.addEventListener(
      "pointercancel",
      finishDrag
    );

    root.addEventListener(
      "lostpointercapture",
      event => {
        if (
          dragging &&
          event.pointerId === pointerId
        ) {
          dragging = false;
          pointerId = null;
          lockedDirection = 0;

          render(
            open >= 0.48 ? 1 : 0,
            true
          );
        }
      }
    );

    root.addEventListener(
      "click",
      () => {
        if (suppressClick) {
          suppressClick = false;
          return;
        }

        userInteracted = true;

        render(
          startOpen >= 0.5 ? 0 : 1,
          true
        );
      }
    );

    root.addEventListener(
      "keydown",
      event => {
        let next = open;

        if (
          event.key === "ArrowRight" ||
          event.key === "ArrowUp"
        ) {
          next += event.shiftKey
            ? 0.2
            : 0.08;
        } else if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowDown"
        ) {
          next -= event.shiftKey
            ? 0.2
            : 0.08;
        } else if (event.key === "Home") {
          next = 0;
        } else if (event.key === "End") {
          next = 1;
        } else if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          next = open >= 0.5 ? 0 : 1;
        } else {
          return;
        }

        event.preventDefault();
        userInteracted = true;

        render(next, true);
      }
    );

    if (
      !matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches
    ) {
      setTimeout(() => {
        if (userInteracted) return;

        render(1, true);

        setTimeout(() => {
          if (!userInteracted) {
            render(0.04, true);
          }
        }, 1400);
      }, 650);
    }

    render(open, true);
  </script>
</body>
</html>
